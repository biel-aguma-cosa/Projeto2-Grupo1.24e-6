<!-- Conteúdo -->

<div class="container mt-4">


    <h1 class="display-5 fw-bold">
        👥 Cadastro de Pessoas
    </h1>


    <p class="lead">
        Cadastre os pacientes da clínica.
    </p>



    <!-- Cadastro de Pessoa -->

    <div class="row mt-4">

        <div class="col-md-8 mx-auto">

            <div class="card shadow">


                <!-- Cabeçalho -->

                <div class="card-header bg-dark text-white">

                    <h5 class="mb-0">
                        👤 Cadastrar Pessoa
                    </h5>

                </div>



                <!-- Formulário -->

                <div class="card-body">

                    <form>


                        <!-- Nome -->

                        <div class="mb-3">

                            <label for="person_name" class="form-label">
                                Nome
                            </label>


                            <input
                                type="text"
                                id="person_name"
                                class="form-control"
                                placeholder="Digite o nome"
                            >

                        </div>



                        <!-- Sobrenome -->

                        <div class="mb-3">

                            <label for="person_last_name" class="form-label">
                                Sobrenome
                            </label>


                            <input
                                type="text"
                                id="person_last_name"
                                class="form-control"
                                placeholder="Digite o sobrenome"
                            >

                        </div>



                        <!-- E-mail -->

                        <div class="mb-3">

                            <label for="person_email" class="form-label">
                                E-mail
                            </label>


                            <input
                                type="email"
                                id="person_email"
                                class="form-control"
                                placeholder="Digite o e-mail"
                            >

                        </div>



                        <!-- Botão -->

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >

                            Cadastrar Pessoa

                        </button>


                    </form>

                </div>

            </div>

        </div>

    </div>


</div>
